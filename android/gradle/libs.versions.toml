# Version catalog: single source of truth for dependency versions (stack/07-android).
# Versions marked "verified" were checked against primary sources on 2026-11-25
# (docs/research/04-native-mobile.md). Other versions were read from Maven Central / Google Maven metadata on 2026-11-25.

[versions]
agp = "9.5.1"                 # verified (requires Gradle >= 9.6, JDK 17)
kotlin = "2.4.21"             # verified
composeBom = "2026.11.01"     # verified (Compose UI 1.13.0, Material 3 1.5.0)
androidxHilt = "1.4.0"        # verified (androidx.hilt; needs AGP 9.2+ with Compose)
daggerHilt = "2.60.1"         # Maven Central metadata, 2026-11-25
ksp = "2.3.14"                # Maven Central metadata, 2026-11-25; confirm Kotlin 2.4.21 pairing in Phase 0
playIntegrity = "1.6.0"       # verified
ivsPlayer = "1.58.1"          # verified
connectKotlin = "0.10.0"      # verified (pre-1.0, pinned)
protobufJavalite = "4.36.2"    # latest stable on Maven Central (4.37.0 is RC)
sentryAndroid = "8.65.1"      # verified
okhttp = "5.5.1"              # Maven Central metadata, 2026-11-25
datastore = "1.3.0"           # Google Maven metadata, 2026-11-25
benchmarkMacro = "1.5.0"      # latest stable on Google Maven (1.6.0 is alpha)
profileinstaller = "1.4.1"    # Google Maven metadata, 2026-11-25
junit = "4.13.2"               # Maven Central metadata, 2026-11-25
orgJson = "20260814"          # real org.json for local unit tests (Android stub is not usable); Maven Central 2026-11-25
activityCompose = "1.13.0"    # stable per developer.android.com/jetpack/androidx/releases/activity, 2026-11-28

minSdk = "26"                 # ADR-0004
targetSdk = "36"              # Play requirement since 2026-08-31
compileSdk = "37"             # AGP 9.5 max API 37
compileSdkMinor = "1"         # 37.1: Compose 1.13 needs it (compose-ui notes, 1.13.0-alpha03)

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui-tooling ={ group = "androidx.compose.ui", name = "ui-tooling" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "daggerHilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "daggerHilt" }
play-integrity = { group = "com.google.android.play", name = "integrity", version.ref = "playIntegrity" }
ivs-player = { group = "com.amazonaws", name = "ivs-player", version.ref = "ivsPlayer" }
connect-kotlin = { group = "com.connectrpc", name = "connect-kotlin", version.ref = "connectKotlin" }
connect-kotlin-okhttp = { group = "com.connectrpc", name = "connect-kotlin-okhttp", version.ref = "connectKotlin" }
connect-kotlin-google-javalite-ext = { group = "com.connectrpc", name = "connect-kotlin-google-javalite-ext", version.ref = "connectKotlin" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobufJavalite" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentryAndroid" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# build-logic dependencies
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Convention plugins (build-logic/convention)
tirivia-android-application = { id = "tirivia.android.application" }
tirivia-android-library = { id = "tirivia.android.library" }
tirivia-android-feature = { id = "tirivia.android.feature" }
tirivia-android-compose = { id = "tirivia.android.compose" }
tirivia-hilt = { id = "tirivia.hilt" }
