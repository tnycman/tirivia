# Architecture rules for the modular monolith (stack/03-backend-go).
# Every module may depend only on platform/* and contracts. cmd/ (outside workdir) wires modules.
# Tool: https://github.com/fe3dback/go-arch-lint
version: 3
workdir: internal

allow:
  depOnAnyVendor: true

components:
  platform:  { in: [platform, platform/**] }
  contracts: { in: contracts }
  game: { in: [game, game/**] }
  studio: { in: [studio, studio/**] }
  engage: { in: [engage, engage/**] }
  auth: { in: [auth, auth/**] }
  profile: { in: [profile, profile/**] }
  content: { in: [content, content/**] }
  wallet: { in: [wallet, wallet/**] }
  risk: { in: [risk, risk/**] }
  notify: { in: [notify, notify/**] }
  chatmod: { in: [chatmod, chatmod/**] }

commonComponents:
  - platform
  - contracts

deps:
  game: { mayDependOn: [game, platform, contracts] }
  studio: { mayDependOn: [studio, platform, contracts] }
  engage: { mayDependOn: [engage, platform, contracts] }
  auth: { mayDependOn: [auth, platform, contracts] }
  profile: { mayDependOn: [profile, platform, contracts] }
  content: { mayDependOn: [content, platform, contracts] }
  wallet: { mayDependOn: [wallet, platform, contracts] }
  risk: { mayDependOn: [risk, platform, contracts] }
  notify: { mayDependOn: [notify, platform, contracts] }
  chatmod: { mayDependOn: [chatmod, platform, contracts] }
