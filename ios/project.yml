# XcodeGen 2.49.0 spec; CI generates Tirivia.xcodeproj from it (research 15).
name: Tirivia
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  Core:
    path: Packages/Core
  Features:
    path: Packages/Features
targets:
  TiriviaApp:
    type: application
    platform: iOS
    sources: [App/TiriviaApp]
    scheme: {}
    dependencies:
      - package: Features
      - package: Core
        product: DesignSystem
    info:
      path: App/TiriviaApp/Info.plist
      properties:
        CFBundleDisplayName: Tirivia
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tirivia.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
