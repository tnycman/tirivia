# XcodeGen 2.49.0 spec; CI generates Trivia.xcodeproj from it (research 15).
name: Trivia
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  Core:
    path: Packages/Core
  Features:
    path: Packages/Features
targets:
  TriviaApp:
    type: application
    platform: iOS
    sources: [App/TriviaApp]
    scheme: {}
    dependencies:
      - package: Features
      - package: Core
        product: DesignSystem
    info:
      path: App/TriviaApp/Info.plist
      properties:
        CFBundleDisplayName: Trivia
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: al.trivia.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
