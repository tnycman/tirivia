syntax = "proto3";

package tirivia.cue.v1;

import "tirivia/common/v1/common.proto";

// Timed-metadata cues in the IVS stream: "t1." + base64url(SignedCue), at most 900 bytes (SPEC §6.4).

message SignedCue {
  // Serialized CueBody.
  bytes body = 1;
  // Ed25519 signature over `body` (64 bytes).
  bytes signature = 2;
  // Signing key id; apps ship the current and next public keys and fetch rotations via config.
  uint32 key_id = 3;
}

message CueBody {
  // Show this cue belongs to. Apps drop cues for any other show.
  string show_id = 1;
  // Strictly increasing per show. Cues are idempotent by (show_id, seq); gaps trigger GetShowState.
  uint64 seq = 2;
  // Server time when the cue was emitted (unix ms). Informational only; deadlines are server-side.
  int64 emitted_at_unix_ms = 3;

  oneof kind {
    QuestionOpen question_open = 10;
    QuestionClosed question_closed = 11;
    Reveal reveal = 12;
    Pulse pulse = 13;
    BurstStart burst_start = 14;
    BurstEnd burst_end = 15;
    Final final = 16;
  }
}

// Fired by studio when the producer releases a question. Never contains the correct answer.
message QuestionOpen {
  string question_id = 1;
  // 1..12
  uint32 index = 2;
  // Client timer duration; the timer starts when this cue is rendered in the player's own video.
  uint32 duration_ms = 3;
  // Question text in the show language.
  string text = 4;
  // Exactly three options in canonical order.
  repeated Option options = 5;
  // True on the final question: extra lives cannot be used (Master Plan §1).
  bool is_final = 6;
  // True on the last three questions: focus loss voids the answer (Master Plan §7, DEFAULT).
  bool focus_loss_voids = 7;
}

message Option {
  // Short stable id ("a","b","c") scoped to the question.
  string option_id = 1;
  // Max 64 UTF-8 bytes.
  string text = 2;
}

message QuestionClosed {
  string question_id = 1;
}

message Reveal {
  string question_id = 1;
  string correct_option_id = 2;
  // Per-option answer counts for the answer bars, keyed by option_id.
  map<string, uint64> option_counts = 3;
  uint64 players_remaining = 4;
}

// Show phase mirrored from the server state machine (SPEC §6.2).
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_SCHEDULED = 1;
  PHASE_LOBBY = 2;
  PHASE_QUESTION_OPEN = 3;
  PHASE_QUESTION_CLOSED = 4;
  PHASE_REVEAL = 5;
  PHASE_FINAL = 6;
  PHASE_SETTLED = 7;
}

// Every 3-5 s. Carries live counts and enough state for a late joiner to resynchronise.
message Pulse {
  uint64 viewers = 1;
  uint64 players_remaining = 2;
  // Running totals per reaction kind since show start.
  map<int32, uint64> reaction_totals = 3; // key = tirivia.common.v1.ReactionKind number
  Phase phase = 4;
  // Current or last question index (0 before the first question).
  uint32 question_index = 5;
  // If a question is open: milliseconds left on the server's clock at emit time.
  uint32 remaining_ms = 6;
  // False while a question is open (reactions pause; Master Plan §2.3) or when the reactions kill switch is on.
  bool reactions_enabled = 7;
  // Backend chat switch (SPEC §6.10).
  bool chat_enabled = 8;
}

message BurstStart {
  string burst_id = 1;
  // Host prompt, e.g. "Dërgo zemra për Prishtinën".
  string label = 2;
  tirivia.common.v1.ReactionKind kind = 3;
  BurstScope scope = 4;
  uint32 duration_ms = 5;
}

enum BurstScope {
  BURST_SCOPE_UNSPECIFIED = 0;
  BURST_SCOPE_CITY = 1;
  BURST_SCOPE_COUNTRY = 2;
}

message BurstEnd {
  string burst_id = 1;
  // Top entries of the meter, e.g. city or country name -> count.
  map<string, uint64> meter = 2;
}

message Final {
  uint64 winners = 1;
  // Prize per winner before risk review; confirmed amounts come via the wallet.
  tirivia.common.v1.Money provisional_prize_per_winner = 2;
}
