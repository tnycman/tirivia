syntax = "proto3";

package tirivia.events.v1;

import "google/protobuf/timestamp.proto";

// Event envelope written to Kinesis Data Streams by `game` and `core`; consumed by `risk`.
message Event {
  // UUIDv7.
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string user_id = 3;
  string device_id = 4;
  string show_id = 5;
  // Producer service name, e.g. "game", "auth".
  string source = 6;

  oneof payload {
    AnswerSubmitted answer_submitted = 10;
    ReactionBatch reaction_batch = 11;
    ShowJoined show_joined = 12;
    OtpRequested otp_requested = 13;
    AttestationResult attestation_result = 14;
    ExtraLifeUsed extra_life_used = 15;
    ReferralCompleted referral_completed = 16;
  }
}

message AnswerSubmitted {
  string question_id = 1;
  uint32 question_index = 2;
  string option_id = 3;
  bool correct = 4;
  // Server receive time minus question_open emit time.
  uint32 server_elapsed_ms = 5;
  uint32 client_elapsed_ms = 6;
  uint32 focus_loss_count = 7;
  uint32 focus_loss_total_ms = 8;
  bool screen_captured = 9;
  bool overlay_detected = 10;
  bool accessibility_automation_detected = 11;
  bool accepted = 12;
}

message ReactionBatch {
  uint32 total_taps = 1;
  bool capped = 2;
}

message ShowJoined {
  string country_code = 1;
  string city = 2;
  string app_version = 3;
  string platform = 4;
}

message OtpRequested {
  string phone_hash = 1;
  string number_range_prefix = 2;
  string line_type = 3;
  string provider = 4;
  bool sent = 5;
}

message AttestationResult {
  string platform = 1;
  bool passed = 2;
  string verdict_summary = 3;
  // iOS App Attest risk metric (approx. keys attested on this device in 30 days).
  uint32 app_attest_risk_metric = 4;
}

message ExtraLifeUsed {
  string question_id = 1;
}

message ReferralCompleted {
  string referrer_user_id = 1;
}
