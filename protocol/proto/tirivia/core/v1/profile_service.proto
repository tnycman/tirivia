syntax = "proto3";

package tirivia.core.v1;

service ProfileService {
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse);
}

message Profile {
  string user_id = 1;
  string display_name = 2;
  string city = 3;
  // ISO 3166-1 alpha-2 (XK used for Kosovo).
  string country_code = 4;
  bool is_diaspora = 5;
  string locale = 6;
  ProfileStats stats = 7;
  // Winners-wall consent (Master Plan §4 privacy).
  bool show_on_winners_wall = 8;
  string referral_code = 9;
}

message ProfileStats {
  uint32 games_played = 1;
  uint32 best_streak = 2;
  uint32 wins = 3;
  uint32 rank = 4;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  Profile profile = 1;
}

message UpdateMyProfileRequest {
  string display_name = 1;
  string city = 2;
  string locale = 3;
  bool show_on_winners_wall = 4;
}

message UpdateMyProfileResponse {
  Profile profile = 1;
}

enum LeaderboardScope {
  LEADERBOARD_SCOPE_UNSPECIFIED = 0;
  LEADERBOARD_SCOPE_COUNTRY = 1;
  LEADERBOARD_SCOPE_CITY = 2;
  LEADERBOARD_SCOPE_DIASPORA_VS_HOMELAND = 3;
}

message GetLeaderboardRequest {
  LeaderboardScope scope = 1;
  string period = 2; // "week" | "month" | "all"
}

message LeaderboardEntry {
  string label = 1;
  uint64 score = 2;
  uint32 rank = 3;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  LeaderboardEntry me = 2;
}

enum PushProvider {
  PUSH_PROVIDER_UNSPECIFIED = 0;
  PUSH_PROVIDER_APNS = 1;
  PUSH_PROVIDER_FCM = 2;
  // iOS Live Activity push-to-start token (iOS 17.2+).
  PUSH_PROVIDER_APNS_LIVE_ACTIVITY_START = 3;
}

message RegisterPushTokenRequest {
  PushProvider provider = 1;
  string token = 2;
}

message RegisterPushTokenResponse {}
