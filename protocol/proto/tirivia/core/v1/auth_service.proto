syntax = "proto3";

package tirivia.core.v1;

// Auth (core deployable). Order of operations is enforced server-side:
//   Attest  ->  StartOtp  ->  VerifyOtp  ->  (RefreshSession)*
// An OTP is never sent without a fresh, verified attestation (Master Plan §7, SIM farms / OTP pumping).
service AuthService {
  // Returns a server nonce for App Attest / Play Integrity. The nonce is single-use and short-lived.
  rpc GetAttestationChallenge(GetAttestationChallengeRequest) returns (GetAttestationChallengeResponse);
  // Verifies an App Attest assertion/attestation or a Play Integrity token bound to the challenge.
  rpc Attest(AttestRequest) returns (AttestResponse);
  rpc StartOtp(StartOtpRequest) returns (StartOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  // Refresh-token rotation with reuse detection (RFC 9700 §2.2.2 / §4.14).
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
}

message GetAttestationChallengeRequest {
  Platform platform = 1;
}

message GetAttestationChallengeResponse {
  bytes challenge = 1;
  uint32 ttl_seconds = 2;
}

message AttestRequest {
  Platform platform = 1;
  bytes challenge = 2;
  // iOS: App Attest key id + attestation object (first time) or assertion (later).
  string app_attest_key_id = 3;
  bytes app_attest_object = 4;
  bytes app_attest_assertion = 5;
  // Android: Play Integrity standard-request token.
  string play_integrity_token = 6;
  // Public part of the device-bound key used for sender-constrained tokens (DPoP-style, RFC 9449).
  bytes device_public_key = 7;
}

message AttestResponse {
  // Opaque, short-lived ticket proving a passed attestation; required by StartOtp and JoinShow.
  string attestation_ticket = 1;
  uint32 ttl_seconds = 2;
}

enum OtpChannel {
  OTP_CHANNEL_UNSPECIFIED = 0;
  OTP_CHANNEL_SMS = 1;
  OTP_CHANNEL_WHATSAPP = 2;
  OTP_CHANNEL_VIBER = 3;
}

message StartOtpRequest {
  // E.164 phone number.
  string phone_e164 = 1;
  string attestation_ticket = 2;
  OtpChannel preferred_channel = 3;
  // BCP 47, e.g. "sq-AL", "en".
  string locale = 4;
}

enum StartOtpResult {
  START_OTP_RESULT_UNSPECIFIED = 0;
  START_OTP_RESULT_SENT = 1;
  START_OTP_RESULT_RATE_LIMITED = 2;
  // VoIP, disposable or low-reputation number range.
  START_OTP_RESULT_NUMBER_NOT_ALLOWED = 3;
  START_OTP_RESULT_ATTESTATION_REQUIRED = 4;
  START_OTP_RESULT_SIGNUPS_PAUSED = 5; // kill switch
}

message StartOtpResponse {
  StartOtpResult result = 1;
  // Opaque id binding the later VerifyOtp to this challenge.
  string otp_request_id = 2;
  OtpChannel channel_used = 3;
  uint32 resend_after_seconds = 4;
}

message VerifyOtpRequest {
  string otp_request_id = 1;
  string code = 2;
}

message Session {
  // Short-lived access token (JWT, EdDSA/ES256, aud/iss/exp validated; RFC 8725).
  string access_token = 1;
  uint32 access_expires_in_seconds = 2;
  // Opaque refresh token, rotated on every use.
  string refresh_token = 3;
  string user_id = 4;
  bool is_new_user = 5;
}

message VerifyOtpResponse {
  Session session = 1;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  Session session = 1;
}

message SignOutRequest {}

message SignOutResponse {}
