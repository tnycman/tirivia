syntax = "proto3";

package tirivia.core.v1;

import "google/protobuf/timestamp.proto";
import "tirivia/common/v1/common.proto";

// Non-hot-path services served by the `core` deployable (SPEC §6.1).
// Master Plan §6 REST-style calls map to these RPCs; see SPEC §6.4.

// ---------------------------------------------------------------- profile
service ProfileService {
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse);
}

message Profile {
  string user_id = 1;
  string display_name = 2;
  string city = 3;
  // ISO 3166-1 alpha-2 (XK used for Kosovo).
  string country_code = 4;
  bool is_diaspora = 5;
  string locale = 6;
  ProfileStats stats = 7;
  // Winners-wall consent (Master Plan §4 privacy).
  bool show_on_winners_wall = 8;
  string referral_code = 9;
}

message ProfileStats {
  uint32 games_played = 1;
  uint32 best_streak = 2;
  uint32 wins = 3;
  uint32 rank = 4;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  Profile profile = 1;
}

message UpdateMyProfileRequest {
  string display_name = 1;
  string city = 2;
  string locale = 3;
  bool show_on_winners_wall = 4;
}

message UpdateMyProfileResponse {
  Profile profile = 1;
}

enum LeaderboardScope {
  LEADERBOARD_SCOPE_UNSPECIFIED = 0;
  LEADERBOARD_SCOPE_COUNTRY = 1;
  LEADERBOARD_SCOPE_CITY = 2;
  LEADERBOARD_SCOPE_DIASPORA_VS_HOMELAND = 3;
}

message GetLeaderboardRequest {
  LeaderboardScope scope = 1;
  string period = 2; // "week" | "month" | "all"
}

message LeaderboardEntry {
  string label = 1;
  uint64 score = 2;
  uint32 rank = 3;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  LeaderboardEntry me = 2;
}

enum PushProvider {
  PUSH_PROVIDER_UNSPECIFIED = 0;
  PUSH_PROVIDER_APNS = 1;
  PUSH_PROVIDER_FCM = 2;
  // iOS Live Activity push-to-start token (iOS 17.2+).
  PUSH_PROVIDER_APNS_LIVE_ACTIVITY_START = 3;
}

message RegisterPushTokenRequest {
  PushProvider provider = 1;
  string token = 2;
}

message RegisterPushTokenResponse {}

// ---------------------------------------------------------------- content
service ContentService {
  // Replays, clips, winners wall, question of the day.
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One like per account per item; cosmetic only (Master Plan §2.4).
  rpc LikeItem(LikeItemRequest) returns (LikeItemResponse);
  rpc RecordView(RecordViewRequest) returns (RecordViewResponse);
  rpc GetShareCard(GetShareCardRequest) returns (GetShareCardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum FeedItemKind {
  FEED_ITEM_KIND_UNSPECIFIED = 0;
  FEED_ITEM_KIND_REPLAY = 1;
  FEED_ITEM_KIND_CLIP = 2;
  FEED_ITEM_KIND_WINNER = 3;
  FEED_ITEM_KIND_QUESTION_OF_THE_DAY = 4;
}

message FeedItem {
  string item_id = 1;
  FeedItemKind kind = 2;
  string title = 3;
  string media_url = 4;
  string thumbnail_url = 5;
  uint64 views = 6;
  uint64 likes = 7;
  bool liked_by_me = 8;
  google.protobuf.Timestamp created_at = 9;
}

message GetFeedRequest {
  string page_token = 1;
}

message GetFeedResponse {
  repeated FeedItem items = 1;
  string next_page_token = 2;
}

message LikeItemRequest {
  string item_id = 1;
  bool like = 2;
}

message LikeItemResponse {
  uint64 likes = 1;
}

message RecordViewRequest {
  string item_id = 1;
}

message RecordViewResponse {}

message GetShareCardRequest {
  string show_id = 1;
}

message GetShareCardResponse {
  // CloudFront URL of the generated image ("I reached question 9" / "I won").
  string image_url = 1;
  string deep_link = 2;
}

// ---------------------------------------------------------------- wallet
service WalletService {
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SubmitClaim(SubmitClaimRequest) returns (SubmitClaimResponse);
}

enum VerificationTier {
  VERIFICATION_TIER_UNSPECIFIED = 0;
  VERIFICATION_TIER_A = 1; // < EUR 50: verified phone; ID at cash-out
  VERIFICATION_TIER_B = 2; // EUR 50-500: ID + selfie + hold + manual review
  VERIFICATION_TIER_C = 3; // > EUR 500 or flagged: B + live video verification
}

enum CollectionOption {
  COLLECTION_OPTION_UNSPECIFIED = 0;
  COLLECTION_OPTION_BANK_TRANSFER_AL = 1;
  COLLECTION_OPTION_IN_PERSON_OFFICE = 2;
  COLLECTION_OPTION_REPRESENTATIVE_POA = 3;
  COLLECTION_OPTION_CHARITY_DONATION = 4;
  COLLECTION_OPTION_SPONSOR_PICKUP_OR_DELIVERY = 5;
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_STATUS_OPEN = 1;
  CLAIM_STATUS_VERIFICATION_REQUIRED = 2;
  CLAIM_STATUS_UNDER_REVIEW = 3;
  CLAIM_STATUS_APPROVED = 4;
  CLAIM_STATUS_PAID = 5;
  CLAIM_STATUS_EXPIRED = 6;
  CLAIM_STATUS_REJECTED = 7;
}

message ClaimCard {
  string claim_id = 1;
  tirivia.common.v1.Money amount = 2;
  google.protobuf.Timestamp deadline = 3;
  VerificationTier tier = 4;
  ClaimStatus status = 5;
  repeated CollectionOption available_options = 6;
}

message GetWalletRequest {}

message GetWalletResponse {
  tirivia.common.v1.Money balance = 1;
  tirivia.common.v1.Money cash_out_minimum = 2;
  repeated ClaimCard claims = 3;
}

message SubmitClaimRequest {
  string claim_id = 1;
  CollectionOption option = 2;
  // IBAN for COLLECTION_OPTION_BANK_TRANSFER_AL; account holder must match the verified ID.
  string iban = 3;
  string charity_id = 4;
}

message SubmitClaimResponse {
  ClaimCard claim = 1;
}
