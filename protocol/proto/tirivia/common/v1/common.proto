syntax = "proto3";

package tirivia.common.v1;

// Money in integer minor units (e.g. cents). Floats are never used for money.
// https://www.postgresql.org/docs/current/datatype-money.html
message Money {
  // ISO 4217 code, e.g. "EUR", "ALL".
  string currency = 1;
  // Amount in minor units. Signed so ledger reversals can be represented.
  int64 amount_minor = 2;
}

// Country-level eligibility, switched server-side without an app release (Master Plan §4).
enum Eligibility {
  ELIGIBILITY_UNSPECIFIED = 0;
  // May win cash and sponsor prizes.
  ELIGIBILITY_ELIGIBLE = 1;
  // Plays for points only; never wins prizes.
  ELIGIBILITY_PLAY_FOR_POINTS = 2;
  // Blocked from prize shows (e.g. under review).
  ELIGIBILITY_BLOCKED = 3;
}

// Reaction kinds. The final set is an owner decision (Master Plan §11); themed sets are
// delivered per show in JoinShowResponse.reaction_set, so new kinds never need an app release.
enum ReactionKind {
  REACTION_KIND_UNSPECIFIED = 0;
  REACTION_KIND_HEART = 1;
  REACTION_KIND_THUMBS_UP = 2;
  REACTION_KIND_FIRE = 3;
  REACTION_KIND_LAUGH = 4;
  REACTION_KIND_CLAP = 5;
  REACTION_KIND_FLAG_AL = 6;
  // Per-show themed icon (football, sponsor). The icon is resolved via ReactionSet.
  REACTION_KIND_THEMED = 7;
}
