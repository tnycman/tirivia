# Android CI (stack/07-android, research 14). Actions pinned to full commit SHAs resolved on 2026-11-28.
name: android-ci

on:
  pull_request:
    paths: ["android/**", "protocol/testvectors/**", ".github/workflows/android-ci.yml"]
  push:
    branches: [main]
    paths: ["android/**", "protocol/testvectors/**", ".github/workflows/android-ci.yml"]

permissions: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build logic
        run: ./gradlew :build-logic:convention:check
      - name: Unit tests (includes protocol/testvectors shuffle vectors)
        run: ./gradlew testDebugUnitTest
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
