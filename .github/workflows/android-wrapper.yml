# Temporary: generates the Gradle wrapper once (research 14); the same PR deletes this file.
name: android-wrapper

on:
  pull_request:
    paths: [".github/workflows/android-wrapper.yml"]

permissions: {}

jobs:
  wrapper:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.2"
      - name: Generate the wrapper (checksum from gradle.org/release-checksums)
        run: gradle wrapper --gradle-version 9.9.2 --gradle-distribution-sha256-sum 971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b
      - run: sha256sum gradle/wrapper/gradle-wrapper.jar && cat gradle/wrapper/gradle-wrapper.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/
          if-no-files-found: error
          retention-days: 1
