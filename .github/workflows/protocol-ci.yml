# Protocol CI: lint, breaking-change detection against main, generated code is up to date.
name: protocol-ci

on:
  pull_request:
    paths: ["protocol/**", "android/core/protocol/src/gen/**", ".github/workflows/protocol-ci.yml"]
  push:
    branches: [main]
    paths: ["protocol/**", "android/core/protocol/src/gen/**"]

permissions: {}

jobs:
  buf:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      - name: Install pinned toolchain (buf 1.75.0, protoc-gen-go, protoc-gen-connect-go)
        run: sh protocol/scripts/install-tools.sh && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        working-directory: protocol
        run: buf lint && buf format -d --exit-code
      - name: Breaking changes vs the PR base commit (skipped only by the "buf skip breaking" label)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        working-directory: protocol
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: buf breaking --against "../.git#commit=${BASE_SHA},subdir=protocol"
      - name: Generated Go code is up to date
        working-directory: protocol
        run: buf generate --template buf.gen.go.yaml && git diff --exit-code -- gen/
      - name: Generated Kotlin code is up to date (BSR token avoids the shared-IP rate limit)
        working-directory: protocol
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          buf generate --template buf.gen.kotlin.yaml
          git diff --exit-code -- ../android/core/protocol/src/gen
          test -z "$(git ls-files --others --exclude-standard -- ../android/core/protocol/src/gen)"
      - name: Test vectors are up to date and pass (Go reference)
        working-directory: backend
        run: go run ./cmd/testvectors -check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test vectors pass an independent implementation (Node)
        run: node protocol/testvectors/runners/node/verify-vectors.mjs
      - name: Cue size budget + vectors (Go reference)
        working-directory: backend
        run: go test ./internal/platform/cuesign/... ./internal/platform/shuffle/...
