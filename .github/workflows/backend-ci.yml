# Backend CI (stack/10-ci-cd). Every action is pinned to a full commit SHA resolved on
# 2026-11-25 (tag in the trailing comment); Renovate's pinGitHubActionDigests keeps them current.
name: backend-ci

on:
  pull_request:
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "protocol/**", ".github/workflows/backend-ci.yml"]

permissions: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trivia
        options: >-
          --health-cmd "pg_isready -U postgres -d trivia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:9.1-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/trivia?sslmode=disable
      TEST_VALKEY_URL: valkey://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Generated queries are up to date (sqlc)
        run: make sqlc-check
      - name: Migrate service database
        run: make migrate DB_URL="$TEST_DATABASE_URL"
      - name: Unit and store tests (race detector; Postgres 17 and Valkey 9.1 services)
        run: go test -race -count=1 ./...
      - name: golangci-lint (incl. depguard module boundaries)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Architecture rules
        run: go run github.com/fe3dback/go-arch-lint@v1.19.2 check
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Schema invariants (Postgres 17)
        run: make db-test

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write       # OIDC to AWS + Sigstore for attestations
      attestations: write
    environment: dev
    strategy:
      matrix:
        cmd: [game, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AWS login only once the account exists; an unset variable reads as an empty string.
      - if: vars.AWS_APPLY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Build ARM64 image
        run: docker build --build-arg CMD=${{ matrix.cmd }} -f backend/Dockerfile -t "$IMAGE" .
        env:
          IMAGE: ${{ vars.ECR_REGISTRY != '' && format('{0}/', vars.ECR_REGISTRY) || '' }}trivia-${{ matrix.cmd }}:${{ github.sha }}
      - name: Smoke test (health, graceful SIGTERM drain)
        env:
          IMAGE: ${{ vars.ECR_REGISTRY != '' && format('{0}/', vars.ECR_REGISTRY) || '' }}trivia-${{ matrix.cmd }}:${{ github.sha }}
          PORT: ${{ matrix.cmd == 'game' && '8080' || '8081' }}
        run: |
          docker run -d --name smoke -e ADDR=":${PORT}" -p "${PORT}:${PORT}" "$IMAGE"
          for _ in $(seq 1 20); do curl -fs "localhost:${PORT}/readyz" && break; sleep 1; done
          curl -fs "localhost:${PORT}/readyz"
          docker stop -t 30 smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = "0"
      # Push + `actions/attest` (SLSA provenance) + deploy to dev are wired in Phase 0 once ECR exists.
      # - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
