name: web-consoles-ci

on:
  pull_request:
    paths: ["web-consoles/**", "protocol/proto/**", ".github/workflows/web-consoles-ci.yml"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web-consoles
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-consoles/package-lock.json
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: "1.75.0"
      - run: npm ci
      - name: Generated TS client is up to date
        run: npm run generate && git diff --exit-code -- packages/api-client/src/gen
      - run: npm run typecheck
      - run: npm run build
